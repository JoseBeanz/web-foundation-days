<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter & Dark Mode</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>📝 Note Keeper</h1>

    <!-- labelled textarea -->
    <label for="note-text">Your note</label>
    <textarea id="note-text" rows="6" placeholder="Start typing here..."></textarea>

    <!-- counters -->
    <div class="counters">
      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>
    </div>

    <!-- buttons -->
    <div class="buttons">
      <button id="clear-btn" type="button">Clear</button>
      <button id="theme-toggle" type="button">Dark mode</button>
    </div>

    <p class="hint">Press <kbd>Esc</kbd> inside the textarea to clear instantly.</p>
  </main>
</body>
</html>
